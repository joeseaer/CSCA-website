# Generated 2026-11-08: dedicated HTTP static site and certificate challenge endpoint.
# Install only this new vhost; preserve hubcsca.dcpstudios.top and all existing applications.
server {
    listen 80;
    server_name www.hubcsca.dcpstudios.top;
    root /wwwdata/wwwdata/CSCA-website-public;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /wwwdata/wwwdata/CSCA-website-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
